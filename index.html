<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  </head>

  <body>
    <div class="app">
        
        <!-- app title -->
        <div class="title-container">
            <p>focus time</p>
        </div>

        <!-- contents -->
        <div class="contents-container">

            <!-- type btns -->
            <div class="type-btns-container">
                <!-- pomodoro btn -->
                <div class="pomodoro">
                    <button class="type-btn" id="pomodoroBtn">pomodoro</button>
                </div>

                <!-- short break btn -->
                <div class="short-break">
                    <button class="type-btn" id="shortBreakBtn">short break</button>
                </div>
                
                <!-- long break btn -->
                <div class="long-break">
                    <button class="type-btn" id="longBreakBtn">long break</button>
                </div>

            </div>

            <!-- timer display -->
            <div class="timer">
                <p id="timerText">25:00</p>
            </div>

            <!-- state btns -->
            <div class="state-btns-containter">

                <!-- start btn -->
                <div class="start-btn">
                    <button class="state-btn" id="startBtn">start</button>
                </div>

                <!-- pause btn -->
                <div class="pause-btn">
                    <button class="state-btn" id="pauseBtn">pause</button>
                </div>

                <!-- reset btn -->
                <div class="reset-btn">
                    <button class="state-btn" id="resetBtn">reset</button>
                </div>

            </div>

        </div>

        <!-- pomodoro count -->
        <div class="pomodoro-count-container">
            <p>pomodoro count: </p>
            <p id="pomodoroCount">0</p>
        </div>
        

    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
        
        <!-- app title -->
        <div class="title">
            <p>focus time</p>
        </div>
        


        <!-- contents -->
        <div class="contents">

            <!-- type btns -->
            <div class="type-btns">
                <!-- pomodoro btn -->
                <div class="pomodoro">
                    <button id="pomodoroBtn">pomodoro</button>
                </div>

                <!-- short break btn -->
                <div class="short-break">
                    <button id="shortBreakBtn">short break</button>
                </div>
                
                <!-- long break btn -->
                <div class="long-break">
                    <button id="longBreakBtn">long break</button>
                </div>

            </div>

            <!-- timer display -->
            <div class="timer">
                <p id="timerText">25:00</p>
            </div>

            <!-- state btns -->
            <div class="state-btns">

                <!-- start btn -->
                <div class="start-btn">
                    <button id="startBtn">start</button>
                </div>

                <!-- pause btn -->
                <div class="pause-btn">
                    <button id="pauseBtn">pause</button>
                </div>

                <!-- reset btn -->
                <div class="reset-btn">
                    <button id="resetBtn">reset</button>
                </div>

            </div>

        </div>

        <!-- pomodoro count -->
        <div class="pomodoro-count">
            <p>pomodoro count: </p>
            <p id="pomodoroCount">0</p>
        </div>
        

    </div>

    <script src="script.js"></script>
  </body>
</html>
